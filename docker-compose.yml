services:
  db:
    image: postgres:16
    environment:
      # Lê do .env (mesma fonte que a DATABASE_URL do backend) — evita o
      # mismatch "password authentication failed". Default 'postgres' p/ dev.
      POSTGRES_DB: ${POSTGRES_DB:-rastreamento}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Bind SÓ no localhost: o Docker abre portas via iptables furando o UFW, então
    # "5432:5432" expunha o Postgres a 0.0.0.0 (internet) — vetor do ataque de wipe.
    # 127.0.0.1 garante que, mesmo sem o override de produção, nada vaza pra fora.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rastreamento"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sem porta publicada: acessível apenas pela rede interna do Docker
    # (backend usa "redis:6379"). Nunca exponha Redis sem senha à internet.
    # restart: o rate limiter (app/core/limiter.py) agora depende do Redis em
    # toda requisição — sem auto-restart, uma queda do container derrubava o
    # rate limiting da aplicação inteira até alguém perceber e subir na mão.

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      # Lê do .env (NUNCA deixe minioadmin em produção). Default só p/ dev local.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # Bind só no localhost (ver nota no serviço db). Em prod o override remove de vez.
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]

  backend:
    build: { context: ./backend }
    # SEC-01: .env fica fora da pasta do projeto (que é sincronizada pelo
    # OneDrive) — ver "Segredos locais" no README para o setup de máquina.
    env_file: ["${MASTERSAT_ENV_FILE:-.env}"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    volumes:
      - "./backend:/app"
      # SEC-01: certificado ICP-Brasil (.pfx) montado de fora do OneDrive —
      # mais específico que o mount acima, sobrepõe só este subcaminho.
      - "${MASTERSAT_CERTS_DIR:-C:/mastersat-secrets/certs}:/app/certs:ro"

  frontend:
    build: { context: ./frontend, target: dev }
    env_file: ["${MASTERSAT_ENV_FILE:-.env}"]
    environment:
      # Bind mount passa pela pasta sincronizada do OneDrive no Windows — os
      # eventos inotify não atravessam esse caminho de forma confiável, então
      # o hot-reload do `next dev` não pegava alterações sem reiniciar o
      # container. Polling força o watchpack a checar os arquivos por
      # intervalo em vez de depender desses eventos.
      WATCHPACK_POLLING: "true"
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
    volumes: ["./frontend:/app", "/app/node_modules"]

  # ─────────────────────────────────────────────────────────────────────────
  # Arquivo local do volume backup_data (docker-volume-backup).
  # NÃO é o backup do sistema e NÃO envia nada para a nuvem: só empacota, às
  # 02:00, o que já está no volume backup_data dentro do próprio container
  # (/archive, sem volume — some se o container for recriado). O deploy de
  # produção nem sobe este serviço. O backup verificável (banco + objetos +
  # manifest + envio externo conferido) é o serviço pg_dump abaixo; ver
  # backup/README.md.
  # ─────────────────────────────────────────────────────────────────────────
  backup:
    image: ghcr.io/offen/docker-volume-backup:v2
    restart: unless-stopped
    environment:
      # Banco de dados
      BACKUP_SOURCES: /backup/db
      BACKUP_FILENAME: "mastersat_db_%Y%m%d_%H%M%S.tar.gz"
      BACKUP_CRON_EXPRESSION: "0 2 * * *"     # 02:00 todos os dias
      BACKUP_RETENTION_DAYS: "${BACKUP_KEEP_DAYS:-30}"
      BACKUP_COMPRESSION: gz
      # Notificação em caso de falha (opcional)
      NOTIFICATION_URLS: "${ALERT_WEBHOOK:-}"
    volumes:
      - backup_data:/backup/db
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      db: { condition: service_healthy }

  # Backup verificável: banco (snapshot consistente) + objetos do MinIO +
  # manifest/checksums + envio externo conferido. Ver backup/README.md.
  #   docker compose --profile backup run --rm pg_dump
  # Restauração/ensaio (nunca sobre o banco em uso):
  #   docker compose --profile backup run --rm pg_dump /opt/mastersat-backup/restore.sh ajuda
  # O nome "pg_dump" foi mantido para o cron já instalado pelo deploy.sh
  # continuar funcionando.
  pg_dump:
    build: { context: ./backup }
    image: mastersat-backup:latest
    restart: "no"
    # Credenciais do destino externo (RCLONE_REMOTE + RCLONE_CONFIG_<REMOTO>_*),
    # webhook e GPG ficam num arquivo SÓ do backup — o .env da aplicação
    # (com a chave Fernet) não é entregue a este container.
    env_file:
      - path: "${BACKUP_ENV_FILE:-./backup/backup.env}"
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-rastreamento}"
      BACKUP_DIR: /backup
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-30}"
      MASTERSAT_GIT_SHA: "${MASTERSAT_GIT_SHA:-desconhecido}"
      # Objetos: o rclone lê o bucket direto do MinIO (S3), sem mc.
      BACKUP_MINIO_SOURCE: "minio_src:${MINIO_BUCKET:-rastreamento}"
      RCLONE_CONFIG_MINIO_SRC_TYPE: s3
      RCLONE_CONFIG_MINIO_SRC_PROVIDER: Minio
      RCLONE_CONFIG_MINIO_SRC_ENDPOINT: http://minio:9000
      RCLONE_CONFIG_MINIO_SRC_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minioadmin}"
      RCLONE_CONFIG_MINIO_SRC_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    volumes:
      - backup_data:/backup
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_started }
    profiles: ["backup"]

volumes:
  postgres_data:
  minio_data:
  backup_data:
