services:
  db:
    image: postgres:16
    environment:
      # Lê do .env (mesma fonte que a DATABASE_URL do backend) — evita o
      # mismatch "password authentication failed". Default 'postgres' p/ dev.
      POSTGRES_DB: ${POSTGRES_DB:-rastreamento}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Bind SÓ no localhost: o Docker abre portas via iptables furando o UFW, então
    # "5432:5432" expunha o Postgres a 0.0.0.0 (internet) — vetor do ataque de wipe.
    # 127.0.0.1 garante que, mesmo sem o override de produção, nada vaza pra fora.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rastreamento"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sem porta publicada: acessível apenas pela rede interna do Docker
    # (backend usa "redis:6379"). Nunca exponha Redis sem senha à internet.
    # restart: o rate limiter (app/core/limiter.py) agora depende do Redis em
    # toda requisição — sem auto-restart, uma queda do container derrubava o
    # rate limiting da aplicação inteira até alguém perceber e subir na mão.

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      # Lê do .env (NUNCA deixe minioadmin em produção). Default só p/ dev local.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # Bind só no localhost (ver nota no serviço db). Em prod o override remove de vez.
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]

  backend:
    build: { context: ./backend }
    # SEC-01: .env fica fora da pasta do projeto (que é sincronizada pelo
    # OneDrive) — ver "Segredos locais" no README para o setup de máquina.
    env_file: ["${MASTERSAT_ENV_FILE:-.env}"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    volumes:
      - "./backend:/app"
      # SEC-01: certificado ICP-Brasil (.pfx) montado de fora do OneDrive —
      # mais específico que o mount acima, sobrepõe só este subcaminho.
      - "${MASTERSAT_CERTS_DIR:-C:/mastersat-secrets/certs}:/app/certs:ro"

  frontend:
    build: { context: ./frontend, target: dev }
    env_file: ["${MASTERSAT_ENV_FILE:-.env}"]
    environment:
      # Bind mount passa pela pasta sincronizada do OneDrive no Windows — os
      # eventos inotify não atravessam esse caminho de forma confiável, então
      # o hot-reload do `next dev` não pegava alterações sem reiniciar o
      # container. Polling força o watchpack a checar os arquivos por
      # intervalo em vez de depender desses eventos.
      WATCHPACK_POLLING: "true"
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
    volumes: ["./frontend:/app", "/app/node_modules"]

  # ─────────────────────────────────────────────────────────────────────────
  # Serviço de backup automático
  # Executa pg_dump diariamente às 02:00 e sobe os arquivos para a nuvem.
  # Configurar no .env:
  #   BACKUP_KEEP_DAYS=30
  #   RCLONE_REMOTE=b2:mastersat-backups   (ou s3:bucket, gdrive:pasta, etc.)
  #   ALERT_WEBHOOK=https://...             (Discord/Slack webhook, opcional)
  # ─────────────────────────────────────────────────────────────────────────
  backup:
    image: ghcr.io/offen/docker-volume-backup:v2
    restart: unless-stopped
    environment:
      # Banco de dados
      BACKUP_SOURCES: /backup/db
      BACKUP_FILENAME: "mastersat_db_%Y%m%d_%H%M%S.tar.gz"
      BACKUP_CRON_EXPRESSION: "0 2 * * *"     # 02:00 todos os dias
      BACKUP_RETENTION_DAYS: "${BACKUP_KEEP_DAYS:-30}"
      BACKUP_COMPRESSION: gz
      # Notificação em caso de falha (opcional)
      NOTIFICATION_URLS: "${ALERT_WEBHOOK:-}"
    volumes:
      - backup_data:/backup/db
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      db: { condition: service_healthy }

  # pg_dump dedicado — executa antes do backup acima capturar os arquivos
  pg_dump:
    image: postgres:16
    restart: "no"
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-rastreamento}"
    volumes:
      - backup_data:/backup
      - ./backup/backup.sh:/backup.sh:ro
    entrypoint: >
      sh -c "
        export PGPASSWORD=$$PGPASSWORD &&
        mkdir -p /backup/db &&
        pg_dump -h db -U $$POSTGRES_USER -d $$POSTGRES_DB --format=custom |
        gzip -9 > /backup/db/mastersat_db_$$(date +%Y%m%d_%H%M%S).sql.gz &&
        find /backup/db -name '*.sql.gz' -mtime +${BACKUP_KEEP_DAYS:-30} -delete &&
        echo 'pg_dump concluído'
      "
    depends_on:
      db: { condition: service_healthy }
    profiles: ["backup"]   # execute com: docker compose --profile backup run pg_dump

volumes:
  postgres_data:
  minio_data:
  backup_data:
