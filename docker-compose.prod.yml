# =============================================================================
# docker-compose.prod.yml — sobrescreve docker-compose.yml para produção
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Ou defina COMPOSE_FILE no servidor:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
# =============================================================================

services:

  # ── nginx + SSL ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Bind mount de ARQUIVO único: ao trocar o nginx.conf (git pull recria o
      # inode), um "nginx -s reload" relê o arquivo ANTIGO. Após mudar a config,
      # use: docker compose ... up -d --force-recreate nginx  (não só reload).
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro   # webroot do desafio ACME (HTTP-01)
    depends_on:
      - backend
      - frontend

  # ── Certbot (emissão/renovação via HTTP-01 / webroot) ────────────────────────
  # Sem Cloudflare: a validação é feita pela porta 80. O nginx serve o desafio
  # em /.well-known/acme-challenge/ a partir do volume certbot_www; o certbot
  # grava os arquivos de desafio nesse mesmo volume. Funciona para emissão e
  # renovação sem precisar parar o nginx. Requer a porta 80 aberta na internet.
  # (Para deploy atrás da Cloudflare via DNS-01, ver docs/deploy-producao.md.)
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Verifica renovação a cada 12h (só renova de fato quando faltam < 30 dias);
    # o método webroot da emissão inicial fica salvo no renewal conf.
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --quiet;
               sleep 43200;
             done"

  # ── Backend em produção (sem volume de código — usa imagem buildada) ─────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    # !reset é necessário porque "ports"/"volumes" são listas: o Compose
    # CONCATENA listas entre arquivos (não sobrescreve), então um simples
    # "ports: []" aqui NÃO removeria o "8000:8000" do docker-compose.yml.
    # Remove mapeamento de porta direta — só expõe via nginx
    ports: !reset []
    expose: ["8000"]
    volumes: !reset []   # sem bind-mount/hot-reload em produção
    # Sem --reload em produção; múltiplos workers para usar os núcleos da VPS.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "3", "--proxy-headers", "--forwarded-allow-ips=*"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }

  # ── Frontend em produção ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner            # build de produção (standalone), não o dev
      args:
        # NEXT_PUBLIC_* são embutidas no build → a URL da API entra aqui.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.mastersat.com.br/api/v1}
    restart: unless-stopped
    env_file: [.env]
    ports: !reset []
    expose: ["3000"]
    volumes: !reset []   # sem bind-mount/hot-reload em produção

  # ── Banco de dados em produção (sem porta exposta externamente) ──────────────
  db:
    restart: unless-stopped
    ports: !reset []
    expose: ["5432"]

  # ── MinIO em produção ────────────────────────────────────────────────────────
  minio:
    restart: unless-stopped
    ports: !reset []
    expose: ["9000", "9001"]

volumes:
  certbot_certs:
  certbot_www:
