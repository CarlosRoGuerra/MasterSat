# =============================================================================
# docker-compose.prod.yml — sobrescreve docker-compose.yml para produção
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Ou defina COMPOSE_FILE no servidor:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
# =============================================================================

services:

  # ── nginx + SSL ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend

  # ── Certbot (renovação automática do certificado SSL) ────────────────────────
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Verifica renovação a cada 12h (certbot só renova quando faltam < 30 dias)
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 43200;
             done"

  # ── Backend em produção (sem volume de código — usa imagem buildada) ─────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    # Remove mapeamento de porta direta — só expõe via nginx
    ports: []
    expose: ["8000"]
    volumes: []   # sem hot-reload em produção
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }

  # ── Frontend em produção ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    ports: []
    expose: ["3000"]
    volumes: []   # sem hot-reload em produção

  # ── Banco de dados em produção (sem porta exposta externamente) ──────────────
  db:
    restart: unless-stopped
    ports: []
    expose: ["5432"]

  # ── MinIO em produção ────────────────────────────────────────────────────────
  minio:
    restart: unless-stopped
    ports: []
    expose: ["9000", "9001"]

volumes:
  certbot_www:
  certbot_certs:
