# =============================================================================
# nginx.conf — Proxy reverso para o Mastersat em produção
#
# Arquitetura por subdomínio (DNS aponta direto para a VPS):
#   Cliente → nginx:80  → desafio ACME + redirect para HTTPS
#           → nginx:443 → app.mastersat.com.br → frontend:3000
#                       → api.mastersat.com.br → backend:8000
#
# Certificado SSL: emitido via certbot HTTP-01 (webroot em /var/www/certbot),
# cobre os dois subdomínios (SAN cert), guardado em
# /etc/letsencrypt/live/app.mastersat.com.br/ (primeiro -d do certbot).
# (O bloco set_real_ip_from da Cloudflare abaixo só é usado se um dia o site
#  for colocado atrás do proxy da Cloudflare — inofensivo no acesso direto.)
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # ── Segurança global ───────────────────────────────────────────────────────
    server_tokens off;                       # oculta versão do nginx
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Cloudflare: restaura o IP real do visitante ────────────────────────────
    # Sem isso, $remote_addr é sempre um IP de borda da Cloudflare — o rate
    # limiting abaixo e os logs de auditoria do backend ficariam inúteis
    # (todo o tráfego "vem" de um punhado de IPs). A Cloudflare envia o IP
    # real em CF-Connecting-IP. Lista oficial: https://www.cloudflare.com/ips/
    # — revisar periodicamente (raramente muda).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ── Rate limiting via nginx (camada extra antes do FastAPI) ───────────────
    # Uso INTERNO: vários usuários podem compartilhar o mesmo IP (NAT do
    # escritório) e o frontend (SPA) + preflights OPTIONS disparam muitas
    # requisições por carregamento de página. Limites generosos evitam
    # bloquear o uso legítimo; o login mantém um teto anti-brute-force.
    limit_req_zone $binary_remote_addr zone=geral:10m rate=6000r/m;
    limit_req_zone $binary_remote_addr zone=login:10m  rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api:10m    rate=6000r/m;
    limit_req_status 429;   # devolve 429 (Too Many Requests) em vez de 503

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # ── HTTP (porta 80): desafio ACME + redirect para HTTPS ───────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name app.mastersat.com.br api.mastersat.com.br;

        # Let's Encrypt HTTP-01: o certbot grava o desafio em /var/www/certbot
        # (volume certbot_www) e o nginx serve aqui. NÃO redirecionar este path.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Frontend: app.mastersat.com.br ──────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name app.mastersat.com.br;

        ssl_certificate     /etc/letsencrypt/live/app.mastersat.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.mastersat.com.br/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS: força HTTPS por 1 ano após primeira visita
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Alinhado ao MAX_UPLOAD_BYTES do backend (25 MB) + folga do multipart.
        # Estava 50M: o nginx bufferizava o dobro do que o app aceita para
        # depois o proprio app devolver 413.
        client_max_body_size 26M;

        location / {
            limit_req zone=geral burst=600 nodelay;

            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ── API: api.mastersat.com.br ───────────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.mastersat.com.br;

        # Mesmo certificado SAN emitido para app.mastersat.com.br (cobre os 2)
        ssl_certificate     /etc/letsencrypt/live/app.mastersat.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.mastersat.com.br/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 26M;   # ver nota no server de app.mastersat.com.br

        # Rate limit extra no login (proteção dupla nginx + FastAPI)
        location /api/v1/auth/login {
            limit_req zone=login burst=30 nodelay;

            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Docs do FastAPI bloqueados em produção — habilite por IP se precisar:
        #   satisfy any; allow SEU.IP.AQUI; deny all; proxy_pass http://backend:8000;
        location ~ ^/(docs|redoc|openapi.json) {
            deny all;
        }

        location / {
            limit_req zone=api burst=600 nodelay;

            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
