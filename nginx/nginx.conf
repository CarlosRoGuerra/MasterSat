# =============================================================================
# nginx.conf — Proxy reverso para o Mastersat em produção
#
# Fluxo:
#   Cliente → nginx:80  → redireciona para HTTPS
#   Cliente → nginx:443 → /api/* → backend:8000
#                       → /*     → frontend:3000
#
# Certbot renova o certificado SSL automaticamente.
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # ── Segurança global ───────────────────────────────────────────────────────
    server_tokens off;                       # oculta versão do nginx
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ── Rate limiting via nginx (camada extra antes do FastAPI) ───────────────
    limit_req_zone $binary_remote_addr zone=geral:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=login:10m  rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m    rate=200r/m;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name SEU_DOMINIO.COM.BR www.SEU_DOMINIO.COM.BR;

        # Certbot usa este caminho para validação de domínio
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Tudo o mais redireciona para HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS principal ───────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name SEU_DOMINIO.COM.BR www.SEU_DOMINIO.COM.BR;

        # Certificados gerenciados pelo certbot
        ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO.COM.BR/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO.COM.BR/privkey.pem;

        # Configurações SSL modernas (TLS 1.2+)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS: força HTTPS por 1 ano após primeira visita
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 50M;  # permite upload de documentos maiores

        # ── API (backend FastAPI) ─────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Rate limit extra no login (antes do FastAPI também bloquear)
        location /api/v1/auth/login {
            limit_req zone=login burst=3 nodelay;

            proxy_pass         http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Docs FastAPI (apenas em dev — bloqueia em produção) ───────────────
        location ~ ^/(docs|redoc|openapi.json) {
            # Descomente em produção para bloquear acesso externo:
            # deny all;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
        }

        # ── Frontend (Next.js) ────────────────────────────────────────────────
        location / {
            limit_req zone=geral burst=50 nodelay;

            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ── Subdomínio da API (opcional) ──────────────────────────────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name api.SEU_DOMINIO.COM.BR;
    #     ...
    #     location / { proxy_pass http://backend:8000; }
    # }
}
